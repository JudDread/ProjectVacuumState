<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacuum State - Luna Station</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen" class="splash-container">
        <div class="splash-content">
            <h1 class="splash-title">VACUUM STATE</h1>
            <p class="splash-subtitle">Establishing connection to Luna Station...</p>
            <div class="splash-spinner"></div>
        </div>
    </div>

    <!-- Constant Information Bar -->
    <header>
        <div class="header-block">
            <span class="header-label">Location</span>
            <span class="header-item" id="location-name">Luna Station Hub</span>
        </div>
        <div class="header-block header-right">
            <span class="header-label">Credits</span>
            <span class="header-item" id="credit-count">12,500</span>
        </div>
    </header>

    <!-- Dynamic Main Screen Container -->
    <main id="main-display">
        <!-- JavaScript modules inject screens here -->
    </main>

    <footer>
        SECURE CHAT: [Syndicate-Net] Operational tick processing normally...
    </footer>

    <!-- Scripts must load in this exact order -->
    <script src="./assets/js/state.js"></script>
    <script src="./assets/js/lunaHub.js"></script>
</body>
</html>
