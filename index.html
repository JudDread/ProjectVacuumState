<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacuum State - Luna Station</title>
    
    <!-- JavaScript Game Logic Forced First for Tablets -->
    <script>
        let playerCredits = 12500;

        function playCasinoGame() {
            let firstRoll = Math.floor(Math.random() * 6) + 1;
            let guess = prompt(`The current die shows a [ ${firstRoll} ].\n\nWill the next roll be HIGHER or LOWER?\nType "H" for Higher or "L" for Lower:`);
            
            if (guess === null) return;
            guess = guess.trim().toUpperCase();

            if (guess !== 'H' && guess !== 'L') {
                alert("Invalid command input. Transmission aborted.");
                return;
            }

            let secondRoll = Math.floor(Math.random() * 6) + 1;
            let won = false;
            
            if (firstRoll === secondRoll) {
                won = false;
            } else if (guess === 'H' && secondRoll > firstRoll) {
                won = true;
            } else if (guess === 'L' && secondRoll < firstRoll) {
                won = true;
            }

            if (won) {
                playerCredits += 500;
                alert(`The next roll was a [ ${secondRoll} ]!\n\nYou guessed correctly. +500 Credits added to account.`);
            } else {
                playerCredits -= 500;
                alert(`The next roll was a [ ${secondRoll} ].\n\nYou guessed incorrectly (or tied). -500 Credits deducted.`);
            }

            document.getElementById('credit-count').innerText = playerCredits;
        }
    </script>

    <style>
        body {
            background-color: #0d0f12;
            color: #4af626; 
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        header {
            border: 1px solid #4af626;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            background: #14191f;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .header-item {
            font-weight: bold;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #4af626;
            background: #14191f;
            padding: 15px;
            overflow-y: auto;
        }

        h1 {
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0;
            font-size: 1.5rem;
            border-bottom: 2px solid #4af626;
            width: 100%;
            text-align: center;
            padding-bottom: 5px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 500px;
            margin-top: 15px;
        }

        .station-btn {
            background: #1b222b;
            color: #4af626;
            border: 1px solid #4af626;
            padding: 20px;
            font-size: 1.1rem;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            text-align: center;
            border-radius: 4px;
        }

        .station-btn:active {
            background: #4af626;
            color: #0d0f12;
        }

        footer {
            border: 1px solid #4af626;
            padding: 8px;
            background: #14191f;
            margin-top: 10px;
            font-size: 0.8rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div>SYSTEM: <span class="header-item">LUNA ORBIT</span></div>
        <div>CREDITS: <span class="header-item" id="credit-count">12500</span></div>
        <div>ALERTS: <span class="header-item" id="chat-alert" style="color: #ff3333;">(1) MSG</span></div>
    </header>

    <main>
        <h1>Luna Station Hub</h1>
        <p style="color: #8a99a8; text-align: center;">Welcome back, Operator. Select a localized deck module.</p>
        
        <div class="options-grid">
            <button class="station-btn" onclick="alert('Entering Hangar...')">Hangar</button>
            <button class="station-btn" onclick="alert('Entering Shipyard...')">Shipyard</button>
            <button class="station-btn" onclick="alert('Opening Commodity Market...')">Market</button>
            
            <button class="station-btn" onclick="playCasinoGame()" style="color: #ff00ff; border-color: #ff00ff;">Casino</button>
            
            <button class="station-btn" onclick="alert('Accessing Faction Missions...')">Missions</button>
            <button class="station-btn" onclick="alert('Undocking Ship...')" style="border-color: #ff9900; color: #ff9900;">Undock Ship</button>
        </div>
    </main>

    <footer>
        SECURE CHAT: [Syndicate-Net] Operational tick processing normally...
    </footer>

</body>
</html>
