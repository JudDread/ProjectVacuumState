<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacuum State - Luna Station</title>
    <!-- Relative stylesheet link -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    
<!-- Insert this directly below your <body> tag -->
<div id="splash-screen" class="splash-container">
    <div class="splash-content">
        <h1 class="splash-title">VACUUM STATE</h1>
        <p class="splash-subtitle">Establishing connection to Luna Station...</p>
        <div class="splash-spinner"></div>
    </div>
</div>

    <!-- Constant Information Overlay -->
    <header>
        <div>SYSTEM: <span class="header-item">LUNA ORBIT</span></div>
        <div>CREDITS: <span class="header-item" id="credit-count">12500</span></div>
        <div>ALERTS: <span class="header-item" id="chat-alert" style="color: #ff3333;">(1) MSG</span></div>
    </header>

    <!-- Dynamic Main Screen Container -->
    <main id="main-display">
        <!-- JavaScript modules inject screens here -->
    </main>

    <footer>
        SECURE CHAT: [Syndicate-Net] Operational tick processing normally...
    </footer>

    <!-- Scripts must load in this exact order using relative paths -->
    <script src="./state.js"></script>
    <script src="./modules.js"></script>
</body>
</html>
