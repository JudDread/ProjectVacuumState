<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacuum State</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. The Splash Screen Overlay -->
    <div id="splash-screen" class="splash-container">
        <div class="splash-content">
            <h1 class="splash-title">VACUUM STATE</h1>
            <p class="splash-subtitle">Establishing connection to Luna Station...</p>
            <div class="splash-spinner"></div>
        </div>
    </div>

    <!-- 2. Your Game Layout Wrapper (Make sure credit-count is here) -->
    <div id="game-container">
        <div id="header">
            Credits: <span id="credit-count">0</span>
        </div>
        <!-- Your hub buttons and menus go here -->
    </div>

    <!-- 3. Your Script Links -->
    <script src="modules.js"></script>
    <script src="state.js"></script>

    <!-- 4. THE FIX: The Inline Tablet Fail-Safe Script -->
    <script>
        // This runs instantly as soon as the HTML finishes parsing
        setTimeout(function() {
            var splash = document.getElementById('splash-screen');
            if (splash) {
                // Instantly remove it visually and physically
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
                splash.style.display = 'none';
                console.log("Inline HTML script successfully bypassed splash screen.");
            }
        }, 2000);
    </script>

</body>
</html>
